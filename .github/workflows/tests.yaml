name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      # The memory store's tests run against a real pgvector server.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: auri
          POSTGRES_PASSWORD: auri-test
          POSTGRES_DB: auri
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U auri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -p no:cacheprovider
