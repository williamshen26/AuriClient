start_auri_timer:
  name: Start AURI timer
  description: Start a thin-integration AURI timer.
  fields:
    duration:
      required: true
      example: 300
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    satellite_speaker:
      required: false
      example: media_player.kitchen
      selector:
        entity:
          domain: media_player

get_auri_timers:
  name: Get AURI timers
  description: Return all currently running thin-integration AURI timers.

create_auri_sticky_note:
  name: Create AURI sticky note
  description: Create a persistent markdown sticky note entity for dashboards.
  fields:
    note_id:
      required: false
      example: shopping_today
      selector:
        text:
    title:
      required: false
      example: Shopping List
      selector:
        text:
    markdown:
      required: true
      example: "- Milk\n- Bread\n- Eggs"
      selector:
        text:
          multiline: true

delete_auri_sticky_note:
  name: Delete AURI sticky note
  description: Delete one persistent AURI sticky note by note_id.
  fields:
    note_id:
      required: true
      example: shopping_today
      selector:
        text:

get_auri_sticky_notes:
  name: Get AURI sticky notes
  description: Return all currently active persistent AURI sticky notes.
