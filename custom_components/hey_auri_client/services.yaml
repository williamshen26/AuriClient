start_auri_timer:
  name: Start AURI timer
  description: Start a thin-integration AURI timer.
  fields:
    duration:
      required: true
      example: 300
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    satellite_speaker:
      required: false
      example: media_player.kitchen
      selector:
        entity:
          domain: media_player

get_auri_timers:
  name: Get AURI timers
  description: Return all currently running thin-integration AURI timers.

create_auri_sticky_note:
  name: Create AURI sticky note
  description: Create a persistent markdown sticky note entity for dashboards.
  fields:
    note_id:
      required: false
      example: shopping_today
      selector:
        text:
    title:
      required: false
      example: Shopping List
      selector:
        text:
    markdown:
      required: true
      example: "- Milk\n- Bread\n- Eggs"
      selector:
        text:
          multiline: true

delete_auri_sticky_note:
  name: Delete AURI sticky note
  description: Delete one persistent AURI sticky note by note_id.
  fields:
    note_id:
      required: true
      example: shopping_today
      selector:
        text:

get_auri_sticky_notes:
  name: Get AURI sticky notes
  description: Return all currently active persistent AURI sticky notes.

run_memory_job:
  name: Run memory processing
  description: >-
    Turn finished days of owner-mode conversation into Auri's long-term memory
    (normally done every night). Without a date, processes the days that were
    missed; with a date, processes that day.
  fields:
    date:
      required: false
      example: "2026-10-12"
      selector:
        date:
    force:
      required: false
      default: false
      selector:
        boolean:
    days_back:
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 30
          mode: box

run_memory_exam:
  name: Run memory exam
  description: >-
    Ask Auri the questions in hey_auri_memory_exam.yaml (config folder) and
    grade the answers against the expected ones. Write questions, not
    commands: they run like real requests.

assign_mac:
  name: Assign media player MAC
  description: >-
    Manually assign one or more MAC addresses to a media_player entity, merged
    with (not replacing) any MACs already assigned. Useful when a device has
    multiple network interfaces (e.g. Ethernet + Wi-Fi) and HA's device
    registry only learned one -- often not the one it listens for
    wake_on_lan magic packets on.
  fields:
    entity_id:
      required: true
      example: media_player.living_room_my_fire_tv
      selector:
        entity:
          domain: media_player
    mac:
      required: true
      example: "38:9b:73:1d:ea:24"
      selector:
        text:
          multiple: true
